name: Python engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/vault.test.cjs
      - run: node --check docs/studio.js && node --check docs/studio-plus.js && node --check docs/worker.js
