name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug] "
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Include the app/version and the exact difference.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction steps
      description: Never include credentials, personal records or employer data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser and OS, or Python version and command
    validations:
      required: true
